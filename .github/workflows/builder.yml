# The disk builder (tools/make_disk.py) as one program for Windows, macOS and
# Linux: tools/package/build_builder.py on each. No ROM data goes in it.
# Every push builds them (as the run's artifacts); a tag v* also attaches them
# to that release.
name: disk builder

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: make_disk-windows.exe
            exe: make_disk.exe
          - os: macos-latest
            asset: make_disk-macos
            exe: make_disk
          - os: ubuntu-22.04
            asset: make_disk-linux
            exe: make_disk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install numpy pyinstaller

      - name: MinGW (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make git mingw-w64-x86_64-gcc

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $m = "${{ steps.msys2.outputs.msys2-location }}"
          $env:PATH = "$m\mingw64\bin;$m\usr\bin;$env:PATH"
          python tools/package/build_builder.py

      - name: Build (macOS, Linux)
        if: runner.os != 'Windows'
        run: python tools/package/build_builder.py

      - name: Name
        shell: bash
        run: mv dist/${{ matrix.exe }} dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      # the release: a tag v* pushed, or .github/release_version (on main) naming
      # a version with no release yet - the release, and its tag, made here
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME}"; else v=$(tr -d ' \r\n' < .github/release_version 2>/dev/null || true); fi
          [ -n "$v" ] || exit 0
          if [ "${GITHUB_REF_TYPE}" != tag ] && gh release view "$v" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "${{ matrix.asset }}"; then
            exit 0                          # (that release has it already)
          fi
          pre=""; case "$v" in v0.*) pre="--prerelease";; esac
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" $pre --target "${GITHUB_SHA}" \
            --title "Black Tiger AGA $v (test release)" --notes-file .github/release_notes.md || sleep 20
          gh release upload "$v" "dist/${{ matrix.asset }}" --clobber
